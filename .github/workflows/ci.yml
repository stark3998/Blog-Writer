name: CI

# v2 checks for the server, the web app and the shared contracts. No secrets, read-only token.
# Pushes run on main only; branches get CI through their pull request (no duplicate runs).
# The paths are everything the jobs read: the server's db tests check its container registry
# against the Terraform in infra/v2/data, and the docker job builds the root Dockerfile.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "contracts/**"
      - "infra/v2/data/*.tf"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "contracts/**"
      - "infra/v2/data/*.tf"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  # One group per pull request, where a new push cancels the superseded run. Each main commit
  # gets a group of its own: in a shared group a newer run would replace a pending one.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (ruff, pyright, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    env:
      # A uv-managed CPython (the newest 3.12 that uv 0.12.5 knows), never the runner's
      # older system Python: the contract's HTML audit relies on a patched html.parser.
      UV_PYTHON_PREFERENCE: only-managed
      PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"
      # The plan runs CI with asyncio debug: cross-thread loop calls raise, slow callbacks log.
      PYTHONASYNCIODEBUG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
          require-checksums: "true"
          working-directory: server
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install (locked)
        run: uv sync --locked

      # The render package verifies the pinned Mermaid bundle at startup (fail closed), so the
      # app-level tests need it. Node is preinstalled on ubuntu runners; no install scripts run.
      - name: Install the Mermaid bundle (server/vendor)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix vendor

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format
        run: uv run --locked ruff format --check .

      - name: Type-check
        run: uv run --locked pyright

      - name: Test
        run: uv run --locked pytest -q

  web-present:
    name: Detect the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lockfile: ${{ steps.detect.outputs.lockfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: web/package-lock.json
          sparse-checkout-cone-mode: false

      # hashFiles is not available in a job-level `if`, so the check runs here.
      - name: Look for web/package-lock.json
        id: detect
        run: echo "lockfile=${{ hashFiles('web/package-lock.json') != '' }}" >> "$GITHUB_OUTPUT"

  web:
    name: Web (lint, typecheck, test, build)
    needs: web-present
    # Skipped until the web app (and its lockfile) exists.
    if: needs.web-present.outputs.lockfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact pin: jsdom needs >= 24.15.0, and the editor's TipTap pins are gated on tests.
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build, smoke test, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: blog-writer-v2:ci
      # No build-record artifact: the artifacts of a public repository are downloadable.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's default docker driver: the image lands in the local engine for the steps below.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          build-args: BUILD_SHA=${{ github.sha }}

      # blogwriter.main needs Cosmos, so the boot test runs the image's own entrypoint and CMD (tini,
      # uvicorn and its flags) with the core-only factory swapped in. Also checked: the app user,
      # the shipped files, the pinned Mermaid hash, the contract files and a Chromium launch.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" sh -c 'test "$(id -u)" = 10001 && test -s "$BW_SPA_DIR/index.html" && test -s "$BW_RENDER_MERMAID_JS"'
          docker run --rm -i "$IMAGE" python - <<'EOF'
          import hashlib
          import os

          from blogwriter.publish.contract import default_contract
          from blogwriter.render.settings import MERMAID_TINY_SHA256
          from playwright.sync_api import sync_playwright

          default_contract()
          with open(os.environ["BW_RENDER_MERMAID_JS"], "rb") as bundle:
              digest = hashlib.sha256(bundle.read()).hexdigest()
          assert digest == MERMAID_TINY_SHA256, "mermaid.tiny.js does not match MERMAID_TINY_SHA256"
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page()
              page.set_content("<p id='probe'>ok</p>")
              assert page.inner_text("#probe") == "ok"
              browser.close()
          print("contract files, Mermaid bundle and Chromium headless shell: ok")
          EOF

          cmd=$(docker image inspect "$IMAGE" --format '{{json .Config.Cmd}}')
          jq -e 'index("blogwriter.main:app") != null' <<<"$cmd" >/dev/null
          args=$(jq -r 'map(if . == "blogwriter.main:app" then "blogwriter.core.app:app" else . end) | @sh' <<<"$cmd")
          eval "docker run -d --name bw-smoke -p 127.0.0.1:8080:8080 \"\$IMAGE\" $args"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 -o "$RUNNER_TEMP/health.json" http://127.0.0.1:8080/api/health; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs bw-smoke; echo "::error::no answer on /api/health"; exit 1; fi
            sleep 2
          done
          jq -e --arg sha "$GITHUB_SHA" '. == {"status": "ok", "sha": $sha}' "$RUNNER_TEMP/health.json"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 401
          test "$(docker exec bw-smoke cat /proc/1/comm)" = tini
          test "$(docker exec bw-smoke id -u)" = 10001
          # SIGTERM reaches uvicorn through tini and the app stops gracefully (exit 0, not 137).
          docker stop --time 30 bw-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' bw-smoke)" = 0

      - name: Container logs
        if: failure()
        run: docker logs bw-smoke || true

      - name: Scan (Trivy; fixed CRITICAL findings fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
